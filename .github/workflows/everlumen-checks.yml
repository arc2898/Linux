name: EVERLUMEN checks
on:
  push:
    paths:
      - 'themes/everlumen/**'
      - '.github/workflows/everlumen-checks.yml'
  pull_request:
    paths:
      - 'themes/everlumen/**'
      - '.github/workflows/everlumen-checks.yml'
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run EVERLUMEN static and installer checks
        run: themes/everlumen/scripts/smoke-test.sh
