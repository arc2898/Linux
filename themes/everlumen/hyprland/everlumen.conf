# EVERLUMEN // NEUROGLASS legacy Hyprland style fragment.
general {
  gaps_in = 6
  gaps_out = 18
  border_size = 2
  col.active_border = rgba(3bf7eeff) rgba(ff42d0ff) rgba(c6ff3bff) 45deg
  col.inactive_border = rgba(33435b99)
  resize_on_border = true
  allow_tearing = false
}
decoration {
  rounding = 14
  active_opacity = 0.98
  inactive_opacity = 0.92
  shadow {
    enabled = true
    range = 24
    render_power = 4
    color = rgba(03040ccc)
  }
  blur {
    enabled = true
    size = 9
    passes = 3
    vibrancy = 0.24
  }
}
animations {
  enabled = true
  bezier = everLumenBloom, 0.16, 1, 0.3, 1
  bezier = everLumenSnap, 0.22, 1, 0.36, 1
  animation = windows, 1, 5, everLumenBloom, popin 92%
  animation = windowsOut, 1, 3, everLumenSnap, popin 92%
  animation = border, 1, 4, everLumenBloom
  animation = fade, 1, 4, everLumenBloom
  animation = workspaces, 1, 3, everLumenBloom, fade
}
misc {
  disable_hyprland_logo = true
  force_default_wallpaper = 0
}
