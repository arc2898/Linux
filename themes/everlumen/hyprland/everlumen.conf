# EVERLUMEN — compositor style fragment
# Add this file to your Hyprland config with:
# source = ~/.config/everlumen/hyprland/everlumen.conf
# Adjust blur and shadows to taste/performance.

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(8fffd8ee) rgba(c6a7ffee) 45deg
    col.inactive_border = rgba(45556899)
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 16
    active_opacity = 0.96
    inactive_opacity = 0.91
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(080f20aa)
    }
    blur {
        enabled = true
        size = 7
        passes = 3
        vibrancy = 0.16
    }
}

animations {
    enabled = true
    bezier = everlumen, 0.22, 1, 0.36, 1
    animation = windows, 1, 5, everlumen, popin 82%
    animation = windowsOut, 1, 4, everlumen, popin 82%
    animation = border, 1, 5, everlumen
    animation = fade, 1, 5, everlumen
    animation = workspaces, 1, 5, everlumen, slide
}

# Optional: uncomment if your Hyprland version supports these settings.
# group {
#   col.border_active = rgba(8fffd8ee) rgba(c6a7ffee) 45deg
#   col.border_inactive = rgba(45556899)
# }
